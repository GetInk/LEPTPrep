<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Interface</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; }
        textarea { width: 100%; height: 120px; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; }
        button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #1d4ed8; }
        #response { margin-top: 20px; white-space: pre-wrap; background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <h2>AI Assistant Interface</h2>
    <textarea id="promptInput" placeholder="Type your prompt here..."></textarea>
    <br>
    <button onclick="sendToAI()">Generate Response</button>
    
    <div id="response">Response will appear here...</div>

    <script>
        async function sendToAI() {
            const prompt = document.getElementById('promptInput').value;
            const responseDiv = document.getElementById('response');
            
            if (!prompt.trim()) {
                responseDiv.textContent = "Please enter a prompt first.";
                return;
            }

            responseDiv.textContent = "Processing...";

            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer YOUR_OPENROUTER_API_KEY", // Replace with your actual key or load securely
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        // Using OpenRouter's dynamic free auto-router to guarantee uptime
                        "model": "openrouter/free", 
                        "messages": [
                            { "role": "user", "content": prompt }
                        ]
                    })
                });

                const data = await res.json();
                
                if (data.choices && data.choices.length > 0) {
                    responseDiv.textContent = data.choices[0].message.content;
                } else if (data.error) {
                    responseDiv.textContent = "Error: " + data.error.message;
                } else {
                    responseDiv.textContent = "Unexpected response format received.";
                }
            } catch (err) {
                responseDiv.textContent = "Request failed: " + err.message;
            }
        }
    </script>

</body>
</html>
